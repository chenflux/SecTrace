name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Vet & Test
        run: |
          go vet ./...
          go test -count=1 ./...

      - name: Install rsrc & Generate icons
        shell: cmd
        run: |
          go install github.com/akavel/rsrc@latest
          for /f "delims=" %%i in ('go env GOPATH') do set GBIN=%%i\bin
          "%GBIN%\rsrc.exe" -arch 386   -ico assets\sectrace.ico -o rsrc_windows_386.syso
          "%GBIN%\rsrc.exe" -arch amd64 -ico assets\sectrace.ico -o rsrc_windows_amd64.syso
          "%GBIN%\rsrc.exe" -arch arm64 -ico assets\sectrace.ico -o rsrc_windows_arm64.syso

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${{ github.ref_name }}"
          else
            VER="v0.0.0-dev.${{ github.run_number }}"
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "### SecTrace $VER" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "Windows emergency forensics toolkit (single-file GUI, zero dependencies)" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "## Downloads" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "| File | Target |" >> RELEASE_NOTES.md
          echo "|---|---|" >> RELEASE_NOTES.md
          echo "| SecTrace_windows_x64.exe | 64-bit Windows (most PCs) |" >> RELEASE_NOTES.md
          echo "| SecTrace_windows_x86.exe | 32-bit Windows |" >> RELEASE_NOTES.md
          echo "| SecTrace_windows_arm64.exe | ARM64 Windows (Surface Pro X etc) |" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "## Usage" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "- Download, double-click to run (GUI, no install needed)" >> RELEASE_NOTES.md
          echo "- Run as Administrator for event log features" >> RELEASE_NOTES.md
          echo "- Requires WebView2 Runtime (built into Windows 10 1803+)" >> RELEASE_NOTES.md

      - name: Build x86
        shell: cmd
        env:
          GOOS: windows
          GOARCH: '386'
          CGO_ENABLED: '0'
        run: |
          if not exist outputs mkdir outputs
          go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=${{ steps.ver.outputs.version }}" -o outputs\SecTrace_windows_x86.exe .

      - name: Build x64
        shell: cmd
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          if not exist outputs mkdir outputs
          go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=${{ steps.ver.outputs.version }}" -o outputs\SecTrace_windows_x64.exe .

      - name: Build arm64
        shell: cmd
        env:
          GOOS: windows
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: |
          if not exist outputs mkdir outputs
          go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=${{ steps.ver.outputs.version }}" -o outputs\SecTrace_windows_arm64.exe .

      - name: Generate SHA-256
        shell: bash
        run: |
          cd outputs
          for f in *.exe; do
            sha256sum "$f" > "$f.sha256"
          done
          echo "" >> ../RELEASE_NOTES.md
          echo "## SHA-256 Checksums" >> ../RELEASE_NOTES.md
          echo "" >> ../RELEASE_NOTES.md
          echo '```' >> ../RELEASE_NOTES.md
          cat *.sha256 >> ../RELEASE_NOTES.md
          echo '```' >> ../RELEASE_NOTES.md

      - name: Upload artifacts (non-tag push)
        uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: SecTrace_windows
          path: outputs/

      - name: Create Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            outputs/*.exe
            outputs/*.sha256
