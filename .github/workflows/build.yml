name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Install rsrc (icon tool)
        run: go install github.com/akavel/rsrc@latest

      - name: Generate icon resources
        shell: cmd
        run: |
          for /f "delims=" %%i in ('go env GOPATH') do set GBIN=%%i\bin
          "%GBIN%\rsrc.exe" -arch 386   -ico assets\sectrace.ico -o rsrc_windows_386.syso
          "%GBIN%\rsrc.exe" -arch amd64 -ico assets\sectrace.ico -o rsrc_windows_amd64.syso
          "%GBIN%\rsrc.exe" -arch arm64 -ico assets\sectrace.ico -o rsrc_windows_arm64.syso

      - name: Build (x86 / x64 / arm64)
        shell: cmd
        run: |
          set CGO_ENABLED=0
          set VER=%date:~0,4%%date:~5,2%%date:~8,2%+${{ github.sha }}
          go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=ci" -o outputs\SecTrace_windows_x86.exe .
          set GOARCH=
          set GOOS=windows
          set GOARCH=386
          go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=ci" -o outputs\SecTrace_windows_x86.exe .
          set GOARCH=amd64
          go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=ci" -o outputs\SecTrace_windows_x64.exe .
          set GOARCH=arm64
          go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=ci" -o outputs\SecTrace_windows_arm64.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: SecTrace_windows
          path: outputs/
